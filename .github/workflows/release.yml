name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish (empty on tag-push trigger)
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build sdist and wheel (version resolved from the tag)
        run: uv build
      - name: Publish to PyPI
        # zizmor: ignore[use-trusted-publishing]  # deliberate: token secret = zero PyPI-side config per release
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  github:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "pytest-resources $TAG" \
            --notes-file <(awk -v s="## [${TAG#v}]" 'index($0,s)==1{p=1;next} p&&/^## \[/{exit} p' CHANGELOG.md) \
            --latest \
            || gh release edit "$TAG" --latest=true --verify-tag
