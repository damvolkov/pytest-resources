##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "pytest-resources"
dynamic = ["version"]
description = "Lazy, typed, attribute-navigable fixtures for test resource files, with pluggable canonical loaders (e-serde by default)."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "damvolkov", email = "damvolkovv@gmail.com" }]
keywords = ["pytest", "pytest-plugin", "fixtures", "resources", "config", "e-serde", "json", "yaml", "toml", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["pytest>=8.0"]

[project.optional-dependencies]
serde = ["e-serde>=0.2.0,<0.3"]

[project.urls]
Homepage = "https://github.com/damvolkov/pytest-resources"
Source = "https://github.com/damvolkov/pytest-resources"
Issues = "https://github.com/damvolkov/pytest-resources/issues"
Changelog = "https://github.com/damvolkov/pytest-resources/blob/main/CHANGELOG.md"

[project.entry-points."pytest11"]
resources = "pytest_resources.plugin"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-xdist[psutil]>=3.8",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
    "e-serde>=0.2.0,<0.3",
]
docs = [
    "mkdocs-gen-files>=0.6",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.7",
    "mkdocs-section-index>=0.3",
    "mkdocstrings[python]>=1.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    "prek>=0.4",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]
exclude-newer = "7 days"
### e-serde is first-party and can publish same-day; exempt only it from the freshness guard.
exclude-newer-package = { e-serde = "1 hour" }
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

##### VERSION #####
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_resources"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
ignore = ["E501", "ISC001", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "FBT"]

[tool.ruff.lint.isort]
known-first-party = ["pytest_resources", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
### Block the pytest11 entry point so the plugin loads from conftest *after* coverage
### starts (see tests/conftest.py); otherwise it is imported at startup and unmeasurable.
addopts = ["--import-mode=importlib", "-ra", "-p", "no:resources"]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = ["slow: slow tests (deselect with -m 'not slow')"]

##### COVERAGE #####
[tool.coverage.run]
### Path source, not source_pkgs: a pytest11 plugin is imported at startup, before
### coverage starts; package-name resolution then marks it "not measured".
source = ["src/pytest_resources"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$']
