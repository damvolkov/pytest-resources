#  ┌──────────────────────────────────────────────────────────────────────────┐
#  │  tach · architectural import contracts                                     │
#  │  bootstrap: `tach mod` · CI: `tach check` (make arch)                       │
#  └──────────────────────────────────────────────────────────────────────────┘

source_roots = ["src"]
exclude = ["tests", "docs"]
forbid_circular_dependencies = true
exact = true
root_module = "forbid"

[rules]
unused_ignore_directives = "error"

# The plugin is a single cohesive module: every cross-import between its files
# is internal (allowed); only imports to another first-party root would be policed.
[[modules]]
path = "pytest_resources"
layer = "plugin"
depends_on = []
